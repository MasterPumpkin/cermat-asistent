[project]
name = "cermat-asistent"
version = "0.1.0"
description = "Odhad šancí a doporučení středních škol na základě historických dat Cermat (DiPSy éra)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "plotly>=5.18.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.8.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cermat_asistent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
